<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Study Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #111111;
            --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b;
            --cream: #e8e0d0;
            --beige: #a89b8c;
            --hanai: #7a3e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

        /* منوی ناوبری */
        .navbar {
            background-color: var(--bg-card);
            border: 1px solid var(--burgundy-dark);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .nav-item {
            color: var(--beige);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-item i { font-size: 1.5rem; }
        .nav-item:hover, .nav-item.active { color: var(--burgundy-light); }

        /* محتوای داشبورد */
        .dashboard-card {
            background: linear-gradient(135deg, #111111, #1a0a0f);
            border: 1px solid var(--burgundy-dark);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
        }
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: -50px; left: -50px; width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(92,14,27,0.4) 0%, transparent 70%);
        }
        
        .greeting { font-size: 2.5rem; color: var(--cream); margin-bottom: 10px; font-weight: bold; }
        .clock { font-size: 3rem; color: var(--burgundy-light); font-weight: bold; margin: 20px 0; text-shadow: 0 0 20px rgba(92,14,27,0.5); }
        .date { font-size: 1.2rem; color: var(--beige); margin-bottom: 30px; }
        
        .quote-box {
            background-color: rgba(0,0,0,0.5);
            border-right: 4px solid var(--hanai);
            padding: 20px;
            border-radius: 10px;
            font-style: italic;
            color: var(--cream);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- منوی ناوبری -->
    <nav class="navbar">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-item"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-item"><i class="fa-solid fa-link"></i> Links</a>
    </nav>

    <!-- داشبورد -->
    <div class="dashboard-card">
        <div class="greeting" id="greeting">Welcome Back!</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">Loading date...</div>
        
        <div class="quote-box" id="quote">
            "The secret of getting ahead is getting started."
        </div>
    </div>
</div>

<script>
    // ساعت و تاریخ زنده
    function updateTime() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
        
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);

        const hour = now.getHours();
        let greeting = "Welcome Back!";
        if (hour < 12) greeting = "Good Morning!";
        else if (hour < 18) greeting = "Good Afternoon!";
        else greeting = "Good Evening!";
        document.getElementById('greeting').innerText = greeting;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // نقل قول تصادفی
    const quotes = [
        "The secret of getting ahead is getting started.",
        "It always seems impossible until it's done.",
        "Don't watch the clock; do what it does. Keep going.",
        "Believe you can and you're halfway there."
    ];
    document.getElementById('quote').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
</script>

</body>
</html>
