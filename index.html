<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - My Study Planner</title>
    <!-- لود کردن فایل‌های لازم برای تبدیل به اپلیکیشن -->
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    
    <!-- لود کردن آیکون‌ها (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================== استایل‌های کلی ================== */
        :root {
            --bg-main: #0a0a0a; 
            --bg-card: #111111;
            --accent: #5c0e1b; 
            --text-color: #f0e6d2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main); 
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .app-wrapper { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* ================== دکمه‌ها ================== */
        .navbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; margin-top: 60px; }
        .nav-btn {
            background-color: var(--accent); color: #f0e6d2;
            padding: 12px 20px; border-radius: 10px; text-decoration: none;
            display: flex; align-items: center; gap: 8px; font-size: 16px; transition: 0.3s;
        }
        .nav-btn:hover { opacity: 0.8; }
        
        /* ================== کادر اصلی ================== */
        .dashboard-card {
            background: var(--bg-card); border-radius: 20px; padding: 40px 20px;
            text-align: center; border: 1px solid rgba(139,0,0,0.3);
        }
        .greeting { font-size: 2.5rem; margin-bottom: 10px; }
        
        /* ساعت: وسط‌چین */
        .clock { 
            font-size: 3.5rem; 
            font-weight: bold; 
            color: var(--accent); 
            margin: 15px auto; 
            font-family: 'Segoe UI', sans-serif; 
            display: block; 
            text-align: center; 
        }
        
        .date { font-size: 1.2rem; color: #aaa; margin-bottom: 20px; }
        .quote-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; font-style: italic; color: #ccc; border-left: 4px solid var(--accent); }

        /* ================== دکمه تنظیمات ================== */
        #clean-settings-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            background: transparent; border: none; font-size: 28px;
            color: var(--text-color); cursor: pointer; transition: transform 0.3s;
        }
        #clean-settings-btn:hover { transform: rotate(90deg); }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="navbar">
            <a href="index.html" class="nav-btn active"><i class="fas fa-home"></i> Home</a>
            <a href="notes.html" class="nav-btn"><i class="fas fa-book"></i> Notes</a>
            <a href="tasks.html" class="nav-btn"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="timer.html" class="nav-btn"><i class="fas fa-clock"></i> Timer</a>
            <a href="links.html" class="nav-btn"><i class="fas fa-link"></i> Links</a>
            <a href="alarm.html" class="nav-btn"><i class="fas fa-bell"></i> Alarm</a>
            <a href="support.html" class="nav-btn"><i class="fas fa-headphones"></i> Support</a>
        </div>

        <div class="dashboard-card">
            <h1 class="greeting" id="greeting">Good Afternoon!</h1>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">Loading Date...</div>
            <div class="quote-box" id="quote">
                "The secret of getting ahead is getting started."
            </div>
        </div>
    </div>

    <script>
        // ================== اسکریپت ساعت و زمان‌بندی ==================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);

            const hour = now.getHours();
            let greeting = "";

            // زمان‌بندی دقیقی که خودت خواستی:
            if (hour >= 3 && hour < 12) {
                greeting = "Good Morning!"; // ۳ صبح تا ۱۲ ظهر
            } else if (hour >= 12 && hour < 16) {
                greeting = "Good Afternoon!"; // ۱۲ ظهر تا ۴ عصر
            } else if (hour >= 16 && hour < 19) {
                greeting = "Good Evening!"; // ۴ عصر تا ۷ شب
            } else {
                greeting = "Good Night!"; // ۷ شب تا ۳ صبح
            }
            
            document.getElementById('greeting').innerText = greeting;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================== کدهای پروفایل و تنظیمات ==================
        const myImageBase64 = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjgwIiBmaWxsPSIjMWExYTFhIi8+PHBhdGggZD0iTTE2MCAxNDBsMTYwIDB2MjAwbC0xNjAgMHoiIGZpbGw9IiNmMGU2ZDIiLz48cGF0aCBkPSJNMTYwIDE0MGwtMzAgMHYyMjBsMzAgMHoiIGZpbGw9IiNmMGU2ZDIiLz48cGF0aCBkPSJNMTMwIDM2MGwxNjAgMHYzMGwtMTYwIDB6IiBmaWxsPSIjZjBlNmQyIi8+PC9zdmc+';

        const profileBox = document.createElement('div');
        profileBox.style.cssText = 'position:fixed; bottom:20px; right:15px; display:flex; flex-direction:column; align-items:center; background:#111; padding:6px; border-radius:12px; border:1px solid #5c0e1b; z-index:9998; width:50px;';
        profileBox.innerHTML = `<img id="profile-img" src="${myImageBase64}" style="width:30px; height:30px; border-radius:50%; margin-bottom:4px; border:2px solid #5c0e1b;"><span id="profile-name" style="font-size:10px; color:#f0e6d2;">User</span>`;
        document.body.appendChild(profileBox);

        const settingsBtn = document.createElement('button');
        settingsBtn.innerHTML = '<i class="fas fa-cog"></i>';
        settingsBtn.id = 'clean-settings-btn';
        document.body.appendChild(settingsBtn);
    </script>
</body>
</html>
