<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Study Planner</title>
    <!-- خط rel="icon" کاملاً حذف شد تا گوگل دیگه ارور نده -->
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app-loader.js"></script>
    
    <style>
        :root {
            --bg-main: #050505; 
            --bg-card: #111111;
            --burgundy-light: #5c0e1b; 
            --cream: #f0e6d2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-main); color: var(--cream); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-wrapper { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .navbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; margin-top: 50px; }
        .nav-btn { background-color: var(--burgundy-light); color: var(--cream); border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; transition: 0.3s; }
        .nav-btn:hover { background-color: #8b0000; }
        
        .dashboard-card { background: var(--bg-card); border-radius: 20px; padding: 40px 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(139, 0, 0, 0.2); border: 1px solid #333; }
        .greeting { font-size: 2rem; margin-bottom: 10px; color: var(--cream); }
        .clock { font-size: 5rem; font-weight: bold; color: var(--burgundy-light); margin: 10px 0; font-family: monospace; }
        .date { font-size: 1.2rem; color: #aaa; margin-bottom: 20px; }
        .quote-box { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 15px; font-style: italic; color: #ccc; border-left: 4px solid var(--burgundy-light); }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- نوار دکمه‌ها -->
        <div class="navbar">
            <a href="index.html" class="nav-btn active"><i class="fas fa-home"></i> Home</a>
            <a href="notes.html" class="nav-btn"><i class="fas fa-book"></i> Notes</a>
            <a href="tasks.html" class="nav-btn"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="timer.html" class="nav-btn"><i class="fas fa-clock"></i> Timer</a>
            <a href="links.html" class="nav-btn"><i class="fas fa-link"></i> Links</a>
            <a href="alarm.html" class="nav-btn"><i class="fas fa-bell"></i> Alarm</a>
            <a href="support.html" class="nav-btn"><i class="fas fa-headphones"></i> Support</a>
        </div>

        <!-- کادر اصلی -->
        <div class="dashboard-card">
            <h1 class="greeting" id="greeting">Good Morning!</h1>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">Loading Date...</div>
            <div class="quote-box" id="quote">
                "The secret of getting ahead is getting started."
            </div>
        </div>
    </div>

    <script>
        // اسکریپت ساعت و تاریخ
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);

            const hour = now.getHours();
            let greeting = "Good Evening!";
            if (hour < 12) greeting = "Good Morning!";
            else if (hour < 18) greeting = "Good Afternoon!";
            document.getElementById('greeting').innerText = greeting;
        }
        
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
