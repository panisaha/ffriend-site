<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - My Study Planner</title>
    
    <!-- لود کردن FontAwesome (برای آیکون‌ها) و Style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <div class="navbar">
            <a href="index.html" class="nav-btn active"><i class="fas fa-home"></i> Home</a>
            <a href="notes.html" class="nav-btn"><i class="fas fa-book"></i> Notes</a>
            <a href="tasks.html" class="nav-btn"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="timer.html" class="nav-btn"><i class="fas fa-clock"></i> Timer</a>
            <a href="links.html" class="nav-btn"><i class="fas fa-link"></i> Links</a>
            <a href="alarm.html" class="nav-btn"><i class="fas fa-bell"></i> Alarm</a>
            <a href="support.html" class="nav-btn"><i class="fas fa-headphones"></i> Support</a>
        </div>

        <div class="dashboard-card">
            <h1 class="greeting" id="greeting">Good Afternoon!</h1>
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">Loading Date...</div>
            <div class="quote-box" id="quote">
                "The secret of getting ahead is getting started."
            </div>
        </div>
    </div>

    <script>
        // ================== اسکریپت ساعت ==================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);

            const hour = now.getHours();
            let greeting = "Good Evening!";
            if (hour < 12) greeting = "Good Morning!";
            else if (hour < 18) greeting = "Good Afternoon!";
            document.getElementById('greeting').innerText = greeting;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================== پروفایل ==================
        const myImageBase64 = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjgwIiBmaWxsPSIjMWExYTFhIi8+PHBhdGggZD0iTTE2MCAxNDBsMTYwIDB2MjAwbC0xNjAgMHoiIGZpbGw9IiNmMGU2ZDIiLz48cGF0aCBkPSJNMTYwIDE0MGwtMzAgMHYyMjBsMzAgMHoiIGZpbGw9IiNmMGU2ZDIiLz48cGF0aCBkPSJNMTMwIDM2MGwxNjAgMHYzMGwtMTYwIDB6IiBmaWxsPSIjZjBlNmQyIi8+PC9zdmc+';

        const profileBox = document.createElement('div');
        profileBox.id = 'profile-container';
        profileBox.innerHTML = `
            <img id="profile-img" src="${myImageBase64}" alt="Profile">
            <span id="profile-name">User</span>
        `;
        document.body.appendChild(profileBox);

        // ================== دکمه تنظیمات و منو ==================
        const settingsBtn = document.createElement('button');
        settingsBtn.innerHTML = '<i class="fas fa-cog"></i>';
        settingsBtn.id = 'clean-settings-btn';
        document.body.appendChild(settingsBtn);

        // ساخت منوی تنظیمات
        const sidebar = document.createElement('div');
        sidebar.id = 'clean-settings-sidebar';
        sidebar.innerHTML = `
            <h2 style="color: var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0;">Settings</h2>
            <h3 style="margin-top: 20px;">Account</h3>
            <input type="text" placeholder="Your Name" id="usernameInput" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); box-sizing: border-box;">
            <button id="saveNameBtn" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--accent); color: #f0e6d2; border: none; cursor: pointer;">Change Account</button>
            <h3 style="margin-top: 20px;">Theme</h3>
            <label style="display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; color: var(--text-color);"><input type="radio" name="themeMode" value="light" style="margin-right: 10px;"> Day Mode</label>
            <label style="display: flex; align-items: center; cursor: pointer; color: var(--text-color);"><input type="radio" name="themeMode" value="dark" style="margin-right: 10px;" checked> Night Mode</label>
        `;
        document.body.appendChild(sidebar);

        // باز و بسته کردن منو
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.add('open');
        });
        
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !settingsBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        // مدیریت اسم
        const nameInp = document.getElementById('usernameInput');
        const nameDisplay = document.getElementById('profile-name');
        const savedName = localStorage.getItem('userName') || 'User';
        nameInp.value = savedName;
        nameDisplay.innerText = savedName;

        document.getElementById('saveNameBtn').addEventListener('click', () => {
            const newName = nameInp.value || 'User';
            localStorage.setItem('userName', newName);
            nameDisplay.innerText = newName;
        });
    </script>
</body>
</html>
