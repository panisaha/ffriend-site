<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --burgundy-dark: #4a0e1c;
            --burgundy-light: #800020;
            --cream: #f5f0e1;
            --beige: #d4c5a9;
            --hanai: #a0522d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--cream);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* استایل اسکرول‌بار */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--burgundy-light); border-radius: 10px; }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* کارت‌های اصلی */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--burgundy-dark);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h1, h2 {
            color: var(--cream);
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 { font-size: 2.2rem; color: var(--burgundy-light); }
        h2 { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* بخش جزوه و هایلایت */
        .highlighter-tools {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--beige);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: scale(1.15); }

        .notepad {
            width: 100%;
            min-height: 250px;
            padding: 20px;
            background-color: #1a1a1a;
            border: 1px solid var(--burgundy-dark);
            border-radius: 10px;
            color: var(--cream);
            font-size: 1.1rem;
            line-height: 1.8;
            outline: none;
            overflow-y: auto;
        }
        .notepad:focus { border-color: var(--burgundy-light); }

        /* بخش برنامه‌ریز */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .todo-input-group input {
            flex: 1;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid var(--burgundy-dark);
            border-radius: 10px;
            color: var(--cream);
            outline: none;
        }
        .todo-input-group input:focus { border-color: var(--burgundy-light); }

        .btn {
            padding: 12px 20px;
            background-color: var(--burgundy-light);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: var(--burgundy-dark); }

        .todo-list { list-style: none; }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #1a1a1a;
            border-right: 4px solid var(--hanai);
            margin-bottom: 10px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        .todo-item.done span { text-decoration: line-through; color: #666; }
        .todo-item span { flex: 1; cursor: pointer; color: var(--beige); }
        
        .delete-btn {
            background: transparent;
            color: var(--burgundy-light);
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        .delete-btn:hover { color: red; }

        /* بخش لینک‌ها */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: #1a1a1a;
            border: 1px solid var(--burgundy-dark);
            border-radius: 10px;
            text-decoration: none;
            color: var(--cream);
            font-weight: bold;
            transition: all 0.3s;
        }
        .link-item:hover {
            border-color: var(--hanai);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✦ My Study Planner ✦</h1>

    <!-- بخش جزوه و هایلایت -->
    <div class="card">
        <h2><i class="fa-solid fa-pen-nib"></i> Research & Notes</h2>
        <div class="highlighter-tools">
            <div class="color-btn" style="background: #e6d5a8;" onclick="setHighlight('#e6d5a8', '#000')" title="زرد کرم"></div>
            <div class="color-btn" style="background: rgba(128, 0, 32, 0.6);" onclick="setHighlight('rgba(128, 0, 32, 0.6)', '#fff')" title="زرشکی"></div>
            <div class="color-btn" style="background: #556b2f;" onclick="setHighlight('#556b2f', '#fff')" title="سبز زیتونی"></div>
            <div class="color-btn" style="background: #1a2a3a;" onclick="setHighlight('#1a2a3a', '#fff')" title="آبی نفتی"></div>
            <div class="color-btn" style="background: #a0522d;" onclick="setHighlight('#a0522d', '#fff')" title="قهوه‌ای حنایی"></div>
            <div class="color-btn" style="background: transparent; border-color: var(--cream);" onclick="setHighlight('transparent', 'inherit')" title="پاک کردن"><i class="fa-solid fa-eraser" style="font-size: 14px; color: var(--cream);"></i></div>
        </div>
        <div class="notepad" id="notepad" contenteditable="true" placeholder="Write your notes here... (Select text and click a color to highlight)"></div>
    </div>

    <!-- بخش برنامه‌ریز -->
    <div class="card">
        <h2><i class="fa-solid fa-list-check"></i> Task List</h2>
        <div class="todo-input-group">
            <input type="text" id="todoInput" placeholder="Add a new task..." onkeypress="if(event.key==='Enter') addTodo()">
            <button class="btn" onclick="addTodo()"><i class="fa-solid fa-plus"></i></button>
        </div>
        <ul class="todo-list" id="todoList"></ul>
    </div>

    <!-- بخش لینک‌ها -->
    <div class="card">
        <h2><i class="fa-solid fa-link"></i> Quick Links</h2>
        <div class="links-grid">
            <a href="https://github.com" target="_blank" class="link-item"><i class="fa-brands fa-github" style="font-size: 24px; margin-bottom: 8px;"></i> GitHub</a>
            <a href="https://google.com" target="_blank" class="link-item"><i class="fa-brands fa-google" style="font-size: 24px; margin-bottom: 8px;"></i> Google</a>
            <a href="https://minecraft.net" target="_blank" class="link-item"><i class="fa-solid fa-cube" style="font-size: 24px; margin-bottom: 8px;"></i> Minecraft</a>
            <a href="#" class="link-item"><i class="fa-solid fa-plus" style="font-size: 24px; margin-bottom: 8px;"></i> Add Link</a>
        </div>
    </div>
</div>

<script>
    // --- بخش هایلایت ---
    const notepad = document.getElementById('notepad');
    let selectedColor = '#e6d5a8'; 
    let textColor = '#000';

    notepad.innerHTML = localStorage.getItem('friendNotes') || '';
    notepad.addEventListener('input', () => {
        localStorage.setItem('friendNotes', notepad.innerHTML);
    });

    function setHighlight(bgColor, fgColor) {
        selectedColor = bgColor;
        textColor = fgColor;
        // افکت انتخاب شدن
        document.querySelectorAll('.color-btn').forEach(btn => btn.style.transform = 'scale(1)');
        event.currentTarget.style.transform = 'scale(1.2)';
    }

    notepad.addEventListener('mouseup', () => {
        const selection = window.getSelection();
        if (!selection.isCollapsed && notepad.contains(selection.anchorNode)) {
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.backgroundColor = selectedColor;
            if (textColor !== 'inherit') span.style.color = textColor;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            
            localStorage.setItem('friendNotes', notepad.innerHTML);
            selection.removeAllRanges();
        }
    });

    // --- بخش برنامه‌ریز ---
    let todos = JSON.parse(localStorage.getItem('friendTodos')) || [];
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');

    function renderTodos() {
        todoList.innerHTML = '';
        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.done ? 'done' : ''}`;
            li.innerHTML = `
                <span onclick="toggleTodo(${index})">${todo.text}</span>
                <button class="delete-btn" onclick="deleteTodo(${index})"><i class="fa-solid fa-trash"></i></button>
            `;
            todoList.appendChild(li);
        });
        localStorage.setItem('friendTodos', JSON.stringify(todos));
    }

    function addTodo() {
        const text = todoInput.value.trim();
        if (text) {
            todos.push({ text: text, done: false });
            todoInput.value = '';
            renderTodos();
        }
    }

    function toggleTodo(index) {
        todos[index].done = !todos[index].done;
        renderTodos();
    }

    function deleteTodo(index) {
        todos.splice(index, 1);
        renderTodos();
    }

    renderTodos();
</script>
</body>
          </html>
