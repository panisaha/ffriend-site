<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm - My Study Planner</title>
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505; --bg-card: #111111; --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b; --cream: #e8e0d0; --beige: #a89b8c; --hanai: #7a3e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .nav-btn {
            background-color: var(--bg-card); color: var(--beige); text-decoration: none;
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark);
            display: flex; align-items: center; gap: 8px; font-weight: bold; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        .add-alarm-btn {
            background-color: var(--burgundy-light); color: var(--cream);
            border: 1px solid var(--burgundy-dark); padding: 15px;
            border-radius: 15px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex;
            justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(92,14,27,0.4);
        }
        .add-alarm-btn:hover { background-color: var(--burgundy-dark); transform: translateY(-3px); }

        .alarms-list { display: flex; flex-direction: column; gap: 15px; }
        
        .alarm-card {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 20px; border-radius: 15px; display: flex;
            justify-content: space-between; align-items: center;
            transition: 0.3s; border-right: 5px solid var(--hanai);
        }
        .alarm-card:hover { background-color: #1a1a1a; }
        
        .alarm-info { display: flex; flex-direction: column; gap: 5px; }
        .alarm-time-display { font-size: 2rem; font-weight: bold; color: var(--cream); }
        .alarm-title-display { font-size: 1rem; color: var(--burgundy-light); font-weight: bold; }
        .alarm-days-display { font-size: 0.8rem; color: var(--beige); }

        .delete-alarm-btn {
            background: none; border: none; color: var(--burgundy-light);
            font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 10px;
        }
        .delete-alarm-btn:hover { color: red; transform: scale(1.2); }

        /* کادر پاپ‌آپ اختصاصی */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-light);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: fadeIn 0.3s ease; text-align: center;
        }
        .modal-box h3 { color: var(--cream); margin-bottom: 20px; }
        
        .modal-input {
            width: 100%; padding: 12px; margin-bottom: 15px; background-color: #0a0a0a;
            border: 1px solid #222; border-radius: 10px; color: var(--cream); outline: none;
            text-align: center; font-size: 1.1rem;
        }
        .modal-input:focus { border-color: var(--burgundy-light); }

        /* انتخاب روزهای هفته */
        .days-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .day-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333;
            background: #111; color: var(--beige); cursor: pointer; font-weight: bold;
            transition: 0.3s; display: flex; justify-content: center; align-items: center;
        }
        .day-btn.active { background: var(--burgundy-light); color: var(--cream); border-color: var(--cream); }

        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; font-size: 1rem;}
        .btn-yes { background-color: var(--burgundy-light); color: var(--cream); }
        .btn-yes:hover { background-color: var(--burgundy-dark); }
        .btn-no { background-color: #333; color: var(--cream); }
        .btn-no:hover { background-color: #555; }

        /* کادر زنگ زدن */
        .ringing-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); z-index: 2000;
            justify-content: center; align-items: center; flex-direction: column; gap: 20px;
        }
        .ringing-icon { font-size: 5rem; color: var(--burgundy-light); animation: shake 0.5s infinite; }
        .ringing-title { font-size: 2rem; color: var(--cream); }
        .stop-btn {
            background: var(--burgundy-light); color: var(--cream); border: 2px solid var(--cream);
            padding: 15px 40px; border-radius: 30px; font-size: 1.2rem; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .stop-btn:hover { background: var(--burgundy-dark); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <nav class="navbar">
        <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn"><i class="fa-solid fa-link"></i> Links</a>
        <a href="alarm.html" class="nav-btn active"><i class="fa-solid fa-bell"></i> Alarm</a>
    </nav>

    <button class="add-alarm-btn" onclick="openAddAlarmModal()"><i class="fa-solid fa-plus"></i> Add New Alarm</button>
    <div class="alarms-list" id="alarmsList"></div>
</div>

<!-- کادر افزودن آلارم -->
<div class="modal-overlay" id="addAlarmModal">
    <div class="modal-box">
        <h3>Set New Alarm</h3>
        <input type="text" id="alarmTitleInput" class="modal-input" placeholder="Alarm Title (e.g., Study Math)">
        
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
            <input type="number" id="alarmHourInput" class="modal-input" placeholder="HH" min="0" max="23" style="width:80px; margin:0;">
            <span style="font-size:1.5rem; color:var(--cream);">:</span>
            <input type="number" id="alarmMinuteInput" class="modal-input" placeholder="MM" min="0" max="59" style="width:80px; margin:0;">
        </div>

        <div class="days-container" id="daysContainer">
            <div class="day-btn" data-day="0" onclick="toggleDay(this)">Su</div>
            <div class="day-btn" data-day="1" onclick="toggleDay(this)">Mo</div>
            <div class="day-btn" data-day="2" onclick="toggleDay(this)">Tu</div>
            <div class="day-btn" data-day="3" onclick="toggleDay(this)">We</div>
            <div class="day-btn" data-day="4" onclick="toggleDay(this)">Th</div>
            <div class="day-btn" data-day="5" onclick="toggleDay(this)">Fr</div>
            <div class="day-btn" data-day="6" onclick="toggleDay(this)">Sa</div>
        </div>

        <div class="modal-btns">
            <button class="btn-modal btn-yes" onclick="saveAlarm()">Save Alarm</button>
            <button class="btn-modal btn-no" onclick="closeModal('addAlarmModal')">Cancel</button>
        </div>
    </div>
</div>

<!-- کادر زنگ زدن آلارم -->
<div class="ringing-modal" id="ringingModal">
    <i class="fa-solid fa-bell ringing-icon"></i>
    <h2 class="ringing-title" id="ringingTitle">Alarm!</h2>
    <button class="stop-btn" onclick="stopAlarm()">STOP</button>
</div>

<!-- کادر خطا -->
<div class="modal-overlay" id="errorModal">
    <div class="modal-box">
        <h3 style="color: var(--burgundy-light);">Oops!</h3>
        <p id="errorText" style="color: var(--beige); margin-bottom: 20px;"></p>
        <button class="btn-modal btn-no" style="width: 100%;" onclick="closeModal('errorModal')">OK</button>
    </div>
</div>

<script>
    let alarms = JSON.parse(localStorage.getItem('friendAlarms')) || [];
    let selectedDays = [];
    let ringingInterval = null;
    let currentRingingAlarm = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playDing() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 1.5);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showError(msg) { document.getElementById('errorText').innerText = msg; openModal('errorModal'); }

    function openAddAlarmModal() {
        selectedDays = [];
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('alarmTitleInput').value = '';
        document.getElementById('alarmHourInput').value = '';
        document.getElementById('alarmMinuteInput').value = '';
        openModal('addAlarmModal');
    }

    function toggleDay(el) {
        const day = parseInt(el.getAttribute('data-day'));
        if (selectedDays.includes(day)) {
            selectedDays = selectedDays.filter(d => d !== day);
            el.classList.remove('active');
        } else {
            selectedDays.push(day);
            el.classList.add('active');
        }
    }

    function saveAlarm() {
        const title = document.getElementById('alarmTitleInput').value.trim();
        const hour = parseInt(document.getElementById('alarmHourInput').value);
        const minute = parseInt(document.getElementById('alarmMinuteInput').value);

        if (!title) return showError("Please enter an alarm title!");
        if (isNaN(hour) || hour < 0 || hour > 23) return showError("Please enter a valid hour (0-23)!");
        if (isNaN(minute) || minute < 0 || minute > 59) return showError("Please enter a valid minute (0-59)!");
        if (selectedDays.length === 0) return showError("Please select at least one day!");

        const newAlarm = {
            id: Date.now().toString(),
            title: title,
            hour: hour,
            minute: minute,
            days: [...selectedDays],
            isActive: true
        };

        alarms.push(newAlarm);
        saveData();
        renderAlarms();
        closeModal('addAlarmModal');
    }

    function saveData() {
        localStorage.setItem('friendAlarms', JSON.stringify(alarms));
    }

    function renderAlarms() {
        const list = document.getElementById('alarmsList');
        list.innerHTML = '';

        alarms.forEach(alarm => {
            const hourStr = alarm.hour.toString().padStart(2, '0');
            const minuteStr = alarm.minute.toString().padStart(2, '0');
            
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const daysStr = alarm.days.map(d => dayNames[d]).join(', ');

            const card = document.createElement('div');
            card.className = 'alarm-card';
            card.innerHTML = `
                <div class="alarm-info">
                    <div class="alarm-time-display">${hourStr}:${minuteStr}</div>
                    <div class="alarm-title-display">${alarm.title}</div>
                    <div class="alarm-days-display">${daysStr}</div>
                </div>
                <button class="delete-alarm-btn" onclick="deleteAlarm('${alarm.id}')"><i class="fa-solid fa-trash"></i></button>
            `;
            list.appendChild(card);
        });
    }

    function deleteAlarm(id) {
        alarms = alarms.filter(a => a.id !== id);
        saveData();
        renderAlarms();
    }

    // چک کردن زمان برای زنگ زدن
    setInterval(() => {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentDay = now.getDay();
        const currentSecond = now.getSeconds();

        // فقط در ثانیه صفر چک کن که دوبار زنگ نزنه
        if (currentSecond !== 0) return; 

        alarms.forEach(alarm => {
            if (alarm.isActive && 
                alarm.hour === currentHour && 
                alarm.minute === currentMinute && 
                alarm.days.includes(currentDay)) {
                
                triggerAlarm(alarm);
            }
        });
    }, 1000);

    function triggerAlarm(alarm) {
        currentRingingAlarm = alarm;
        document.getElementById('ringingTitle').innerText = alarm.title;
        document.getElementById('ringingModal').style.display = 'flex';
        
        playDing();
        ringingInterval = setInterval(playDing, 2000); // هر ۲ ثانیه یه بار صدا بده
    }

    function stopAlarm() {
        clearInterval(ringingInterval);
        document.getElementById('ringingModal').style.display = 'none';
        
        // اگه می‌خوای آلارم بعد از یه بار زنگ زدن غیرفعال بشه، خط زیر رو فعال کن:
        // if (currentRingingAlarm) {
        //     currentRingingAlarm.isActive = false;
        //     saveData();
        // }
        currentRingingAlarm = null;
    }

    renderAlarms();
</script>

</body>
              </html>
