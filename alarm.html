<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm - My Study Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505; --bg-card: #111111; --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b; --cream: #e8e0d0; --beige: #a89b8c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: var(--bg-main); 
            color: var(--cream); 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }
        
        .app-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 30px; }
        
        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;}
        .nav-btn { background-color: var(--bg-card); color: var(--beige); text-decoration: none; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark); display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1rem; transition: all 0.3s ease; }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        .page-title { font-size: 2rem; color: var(--burgundy-light); text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        .alarm-card { 
            background: linear-gradient(135deg, #0a0a0a, #140508); 
            border: 1px solid var(--burgundy-dark); 
            border-radius: 24px; 
            padding: 40px 20px; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .add-alarm-btn {
            background-color: var(--burgundy-light);
            color: var(--cream);
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            transition: 0.3s;
        }
        .add-alarm-btn:hover { background-color: var(--burgundy-dark); transform: translateY(-2px); }

        /* استایل برای لیست آلارم‌ها که بعدا اضافه میشن */
        .alarm-list { margin-top: 30px; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto; display: flex; flex-direction: column; gap: 15px; }
        .alarm-item { background-color: var(--bg-card); border: 1px solid var(--burgundy-dark); padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .alarm-time { font-size: 1.5rem; font-weight: bold; color: var(--cream); }
        .alarm-delete { background: transparent; color: var(--burgundy-light); border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn"><i class="fa-solid fa-link"></i> Links</a>
        <a href="alarm.html" class="nav-btn active"><i class="fa-solid fa-bell"></i> Alarm</a>
        <a href="support.html" class="nav-btn"><i class="fa-solid fa-headset"></i> Support</a>
    </nav>

    <div class="alarm-card">
        <h1 class="page-title">Alarms</h1>
        
        <button class="add-alarm-btn">
            <i class="fa-solid fa-plus"></i> Add New Alarm
        </button>

        <!-- لیست آلارم ها اینجا میان -->
        <div class="alarm-list" id="alarmList">
            <!-- این یه نمونه است -->
            <div class="alarm-item">
                <span class="alarm-time">07:00 AM</span>
                <button class="alarm-delete"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
