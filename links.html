<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - My Study Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #111111;
            --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b;
            --cream: #e8e0d0;
            --beige: #a89b8c;
            --hanai: #7a3e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

        /* منوی ناوبری */
        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .nav-btn {
            background-color: var(--bg-card); color: var(--beige); text-decoration: none;
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark);
            display: flex; align-items: center; gap: 8px; font-weight: bold; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        /* دکمه افزودن لینک */
        .add-link-btn {
            background-color: var(--burgundy-light); color: var(--cream);
            border: 1px solid var(--burgundy-dark); padding: 15px;
            border-radius: 15px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex;
            justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(92,14,27,0.4);
        }
        .add-link-btn:hover { background-color: var(--burgundy-dark); transform: translateY(-3px); }

        /* لیست لینک‌ها */
        .links-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .link-card {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 15px; border-radius: 12px; display: flex;
            justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .link-card:hover { border-color: var(--hanai); background-color: #1a1a1a; }
        
        .link-info { display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
        .link-name { font-size: 1.1rem; font-weight: bold; color: var(--cream); text-decoration: none; transition: 0.3s; }
        .link-name:hover { color: var(--hanai); }
        .link-url { font-size: 0.8rem; color: var(--beige); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .delete-link-btn {
            background: none; border: none; color: var(--burgundy-light);
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; padding: 10px;
        }
        .delete-link-btn:hover { color: red; transform: scale(1.2); }

        /* کادر پاپ‌آپ (Modal) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: fadeIn 0.3s ease;
        }
        .modal-box h2 { color: var(--cream); margin-bottom: 20px; text-align: center; }
        
        .modal-input {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            background-color: #0a0a0a; border: 1px solid #222; border-radius: 10px;
            color: var(--cream); outline: none; transition: 0.3s;
        }
        .modal-input:focus { border-color: var(--burgundy-light); box-shadow: 0 0 10px rgba(92,14,27,0.3); }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-save, .btn-cancel {
            flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
            border: none; transition: 0.3s; font-size: 1rem;
        }
        .btn-save { background-color: var(--burgundy-light); color: var(--cream); }
        .btn-save:hover { background-color: var(--burgundy-dark); }
        .btn-cancel { background-color: #333; color: var(--cream); }
        .btn-cancel:hover { background-color: #555; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- منوی ناوبری -->
    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn active"><i class="fa-solid fa-link"></i> Links</a>
    </nav>

    <!-- دکمه افزودن لینک -->
    <button class="add-link-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add New Link</button>

    <!-- لیست لینک‌ها -->
    <div class="links-grid" id="linksGrid"></div>
</div>

<!-- کادر پاپ‌آپ -->
<div class="modal-overlay" id="linkModal">
    <div class="modal-box">
        <h2>Add New Link</h2>
        <input type="text" id="linkNameInput" class="modal-input" placeholder="Site Name (e.g., YouTube)">
        <input type="url" id="linkUrlInput" class="modal-input" placeholder="URL (e.g., https://youtube.com)">
        <div class="modal-btns">
            <button class="btn-save" onclick="saveLink()">Save</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    // داده‌های اولیه (اگه کاربر لینک نداشت)
    let links = JSON.parse(localStorage.getItem('friendLinks')) || [
        { id: '1', name: 'GitHub', url: 'https://github.com' },
        { id: '2', name: 'Google', url: 'https://google.com' }
    ];

    function saveData() {
        localStorage.setItem('friendLinks', JSON.stringify(links));
    }

    function renderLinks() {
        const grid = document.getElementById('linksGrid');
        grid.innerHTML = '';

        links.forEach(link => {
            const card = document.createElement('div');
            card.className = 'link-card';
            card.innerHTML = `
                <div class="link-info">
                    <a href="${link.url}" target="_blank" class="link-name">${link.name}</a>
                    <span class="link-url">${link.url}</span>
                </div>
                <button class="delete-link-btn" onclick="deleteLink('${link.id}')" title="Delete link">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            grid.appendChild(card);
        });
    }

    function openModal() {
        document.getElementById('linkModal').style.display = 'flex';
        document.getElementById('linkNameInput').value = '';
        document.getElementById('linkUrlInput').value = '';
        document.getElementById('linkNameInput').focus();
    }

    function closeModal() {
        document.getElementById('linkModal').style.display = 'none';
    }

    function saveLink() {
        const name = document.getElementById('linkNameInput').value.trim();
        let url = document.getElementById('linkUrlInput').value.trim();

        if (!name || !url) {
            alert("Please fill in both fields!");
            return;
        }

        // اطمینان از اینکه لینک با http یا https شروع میشه
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }

        const newLink = {
            id: Date.now().toString(),
            name: name,
            url: url
        };

        links.push(newLink);
        saveData();
        renderLinks();
        closeModal();
    }

    function deleteLink(id) {
        if (confirm("Delete this link?")) {
            links = links.filter(l => l.id !== id);
            saveData();
            renderLinks();
        }
    }

    // بستن کادر با کلیک روی فضای بیرون
    document.getElementById('linkModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // لود اولیه
    renderLinks();
</script>

</body>
</html>
