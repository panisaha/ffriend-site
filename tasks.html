<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - My Study Planner</title>
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505; --bg-card: #111111; --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b; --cream: #e8e0d0; --beige: #a89b8c; --hanai: #7a3e28;
            --green: #4caf50; --yellow: #ffc107; --red: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 25px; }

        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .nav-btn {
            background-color: var(--bg-card); color: var(--beige); text-decoration: none;
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark);
            display: flex; align-items: center; gap: 8px; font-weight: bold; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        .progress-container {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            border-radius: 15px; padding: 20px;
        }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; font-size: 1.1rem; }
        .progress-bar-bg { width: 100%; height: 10px; background-color: #222; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--burgundy-light), var(--hanai));
            border-radius: 10px; transition: width 0.5s ease;
        }

        .task-form {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 25px; border-radius: 20px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .input-field {
            width: 100%; padding: 14px 18px; 
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--burgundy-light);
            border-radius: 12px;
            color: var(--cream); 
            outline: none; 
            transition: 0.3s; 
            font-size: 1rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        .input-field:focus { 
            background-color: rgba(255, 255, 255, 0.1); 
            border-color: var(--hanai); 
            box-shadow: 0 0 15px rgba(92, 14, 27, 0.4); 
        }

        .btn-add {
            background-color: var(--burgundy-light); color: var(--cream); border: 1px solid var(--burgundy-dark);
            padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; 
            font-size: 1.1rem; transition: 0.3s; width: 100%; margin-top: 5px;
        }
        .btn-add:hover { background-color: var(--burgundy-dark); transform: scale(1.02); }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 18px; border-radius: 15px; display: flex; justify-content: space-between;
            align-items: center; border-right: 6px solid #fff; transition: 0.3s;
        }
        .task-item:hover { background-color: #1a1a1a; }
        .task-item.done { opacity: 0.5; border-right-color: var(--green) !important; }
        .task-item.done .task-text { text-decoration: line-through; color: #888; }

        .task-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .task-text { font-size: 1.15rem; font-weight: bold; color: var(--cream); }
        .task-meta { font-size: 0.85rem; color: var(--beige); display: flex; gap: 15px; }
        
        .task-actions { display: flex; gap: 15px; }
        .action-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { transform: scale(1.2); }
        .btn-done { color: var(--green); }
        .btn-delete { color: var(--red); }

        .prio-High { border-right-color: var(--red); }
        .prio-Medium { border-right-color: var(--yellow); }
        .prio-Low { border-right-color: var(--green); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-box {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-light);
            padding: 25px; border-radius: 20px; width: 90%; max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: fadeIn 0.3s ease;
            text-align: center;
        }
        .modal-box h3 { color: var(--cream); margin-bottom: 20px; font-size: 1.2rem; }
        
        .select-btn {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); border: 1px solid #333; color: var(--cream);
            padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.3s;
            font-size: 1rem;
        }
        .select-btn:hover { background: var(--burgundy-dark); border-color: var(--burgundy-light); }
        .select-btn.selected { border-color: var(--cream); background: var(--burgundy-dark); }
        
        .modal-close {
            background-color: #333; color: var(--cream); border: none;
            padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 15px; transition: 0.3s;
        }
        .modal-close:hover { background-color: #555; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
            margin-bottom: 15px; direction: ltr;
        }
        .cal-day-name { color: var(--beige); font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
        .cal-day {
            padding: 10px 5px; border-radius: 8px; background: rgba(255,255,255,0.05);
            cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .cal-day:hover { background: var(--burgundy-dark); }
        .cal-day.selected { background: var(--burgundy-light); color: var(--cream); font-weight: bold; }
        .cal-day.empty { background: transparent; cursor: default; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn active"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn"><i class="fa-solid fa-link"></i> Links</a>
    </nav>

    <div class="progress-container">
        <div class="progress-header">
            <span>Task Progress</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="task-form">
        <input type="text" id="taskInput" class="input-field" placeholder="What needs to be done?">
        
        <div id="dateDisplay" class="input-field" onclick="openModal('dateModal')">
            <i class="fa-regular fa-calendar"></i> Select Due Date
        </div>
        
        <div id="priorityDisplay" class="input-field" onclick="openModal('priorityModal')">
            <i class="fa-solid fa-flag"></i> <span>Medium Priority</span>
        </div>

        <button class="btn-add" onclick="addTask()"><i class="fa-solid fa-plus"></i> Add Task</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
</div>

<div class="modal-overlay" id="dateModal">
    <div class="modal-box">
        <h3>Select Date</h3>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button onclick="changeMonth(-1)" style="background:none; border:none; color:var(--cream); cursor:pointer;"><i class="fa-solid fa-chevron-right"></i></button>
            <span id="monthYearDisplay" style="font-weight:bold;"></span>
            <button onclick="changeMonth(1)" style="background:none; border:none; color:var(--cream); cursor:pointer;"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <button class="modal-close" onclick="closeModal('dateModal')">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="priorityModal">
    <div class="modal-box">
        <h3>Select Priority</h3>
        <div class="select-btn" onclick="setPriority('High', this)">
            <span>🔴 High Priority</span>
            <i class="fa-solid fa-check" style="opacity:0; color:var(--green);"></i>
        </div>
        <div class="select-btn selected" onclick="setPriority('Medium', this)">
            <span>🟡 Medium Priority</span>
            <i class="fa-solid fa-check" style="color:var(--green);"></i>
        </div>
        <div class="select-btn" onclick="setPriority('Low', this)">
            <span>🟢 Low Priority</span>
            <i class="fa-solid fa-check" style="opacity:0; color:var(--green);"></i>
        </div>
        <button class="modal-close" onclick="closeModal('priorityModal')">Cancel</button>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('friendTasks')) || [];
    let selectedDate = '';
    let selectedPriority = 'Medium';
    
    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();

    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
        if(id === 'dateModal') renderCalendar();
    }
    
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('monthYearDisplay').innerText = `${months[currentMonth]} ${currentYear}`;

        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();

        const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        dayNames.forEach(day => {
            const el = document.createElement('div');
            el.className = 'cal-day-name';
            el.innerText = day;
            grid.appendChild(el);
        });

        for(let i=0; i<firstDay; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day empty';
            grid.appendChild(el);
        }

        for(let i=1; i<=daysInMonth; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day';
            el.innerText = i;
            
            const formattedMonth = (currentMonth + 1).toString().padStart(2, '0');
            const formattedDay = i.toString().padStart(2, '0');
            const dateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;
            
            el.onclick = () => {
                selectedDate = dateStr;
                document.getElementById('dateDisplay').innerHTML = `<i class="fa-regular fa-calendar"></i> ${dateStr}`;
                closeModal('dateModal');
            };
            grid.appendChild(el);
        }
    }

    function changeMonth(dir) {
        currentMonth += dir;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    function setPriority(level, el) {
        selectedPriority = level;
        document.getElementById('priorityDisplay').innerHTML = `<i class="fa-solid fa-flag"></i> <span>${level} Priority</span>`;
        
        document.querySelectorAll('.select-btn').forEach(btn => {
            btn.classList.remove('selected');
            btn.querySelector('i').style.opacity = '0';
        });
        el.classList.add('selected');
        el.querySelector('i').style.opacity = '1';
        
        closeModal('priorityModal');
    }

    function saveTasks() {
        localStorage.setItem('friendTasks', JSON.stringify(tasks));
        updateProgress();
    }

    function addTask() {
        const text = document.getElementById('taskInput').value.trim();

        if (!text) return alert("Please enter a task description!");

        const newTask = {
            id: Date.now().toString(),
            text: text,
            date: selectedDate || 'No due date',
            priority: selectedPriority,
            done: false
        };

        tasks.push(newTask);
        document.getElementById('taskInput').value = '';
        
        selectedDate = '';
        document.getElementById('dateDisplay').innerHTML = `<i class="fa-regular fa-calendar"></i> Select Due Date`;
        
        saveTasks();
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';

        tasks.sort((a, b) => a.done - b.done);

        tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item prio-${task.priority} ${task.done ? 'done' : ''}`;
            li.style.animation = 'fadeIn 0.3s ease';
            
            li.innerHTML = `
                <div class="task-info">
                    <span class="task-text">${task.text}</span>
                    <div class="task-meta">
                        <span><i class="fa-regular fa-calendar"></i> ${task.date}</span>
                        <span><i class="fa-solid fa-flag"></i> ${task.priority}</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="action-btn btn-done" onclick="toggleTask('${task.id}')" title="Mark as done">
                        <i class="fa-solid ${task.done ? 'fa-rotate-left' : 'fa-check'}"></i>
                    </button>
                    <button class="action-btn btn-delete" onclick="deleteTask('${task.id}')" title="Delete task">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
            list.appendChild(li);
        });

        updateProgress();
    }

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.done = !task.done;
            saveTasks();
            renderTasks();
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
    }

    function updateProgress() {
        if (tasks.length === 0) {
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';
            return;
        }

        const doneCount = tasks.filter(t => t.done).length;
        const percentage = Math.round((doneCount / tasks.length) * 100);
        
        document.getElementById('progressBar').style.width = `${percentage}%`;
        document.getElementById('progressText').innerText = `${percentage}%`;
    }

    renderTasks();
</script>

</body>
</html>
