<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - My Study Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #111111;
            --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b;
            --cream: #e8e0d0;
            --beige: #a89b8c;
            --hanai: #7a3e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

        /* منوی ناوبری (دکمه‌های شیشه‌ای) */
        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .nav-btn {
            background-color: var(--bg-card); color: var(--beige); text-decoration: none;
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark);
            display: flex; align-items: center; gap: 8px; font-weight: bold; transition: all 0.3s ease;
        }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        /* بخش مدیریت جزوه‌ها */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-box, .new-note-input {
            flex: 1; min-width: 200px; padding: 12px; background-color: var(--bg-card);
            border: 1px solid var(--burgundy-dark); border-radius: 10px; color: var(--cream); outline: none;
        }
        .search-box:focus, .new-note-input:focus { border-color: var(--burgundy-light); }
        
        .btn-primary {
            background-color: var(--burgundy-light); color: var(--cream); border: 1px solid var(--burgundy-dark);
            padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-primary:hover { background-color: var(--burgundy-dark); }

        /* لیست جزوه‌ها */
        .notes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .note-card {
            background-color: var(--bg-card); border: 1px solid var(--burgundy-dark);
            padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .note-card:hover { border-color: var(--hanai); transform: translateY(-3px); }
        .note-card.active { border-color: var(--cream); background-color: var(--burgundy-dark); }
        .note-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: var(--cream); }
        .note-preview { font-size: 0.85rem; color: var(--beige); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ادیتور */
        .editor-container { background-color: var(--bg-card); border: 1px solid var(--burgundy-dark); border-radius: 15px; padding: 20px; display: none; flex-direction: column; gap: 15px; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; }
        .editor-title { font-size: 1.2rem; color: var(--burgundy-light); font-weight: bold; }
        .delete-note-btn { color: var(--burgundy-light); background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        .delete-note-btn:hover { color: red; }

        .highlighter-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--beige); cursor: pointer; transition: 0.2s; }
        .color-btn:hover { transform: scale(1.15); }

        .notepad {
            width: 100%; min-height: 300px; padding: 15px; background-color: #1a1a1a;
            border: 1px solid var(--burgundy-dark); border-radius: 10px; color: var(--cream);
            font-size: 1.1rem; line-height: 1.8; outline: none; overflow-y: auto;
        }
        .notepad:focus { border-color: var(--burgundy-light); }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- منوی ناوبری -->
    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn active"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn"><i class="fa-solid fa-link"></i> Links</a>
    </nav>

    <!-- بخش مدیریت جزوه‌ها -->
    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes..." oninput="renderNotes()">
        <input type="text" class="new-note-input" id="newNoteTitle" placeholder="New note title...">
        <button class="btn-primary" onclick="createNote()"><i class="fa-solid fa-plus"></i> New Note</button>
    </div>

    <!-- لیست جزوه‌ها -->
    <div class="notes-list" id="notesList"></div>

    <!-- ادیتور جزوه -->
    <div class="editor-container" id="editorContainer">
        <div class="editor-header">
            <div class="editor-title" id="currentNoteTitle"></div>
            <button class="delete-note-btn" onclick="deleteCurrentNote()" title="Delete this note"><i class="fa-solid fa-trash"></i></button>
        </div>
        
        <div class="highlighter-tools">
            <div class="color-btn" style="background: #e6d5a8;" onclick="setHighlight('#e6d5a8', '#000')"></div>
            <div class="color-btn" style="background: rgba(128, 0, 32, 0.7);" onclick="setHighlight('rgba(128, 0, 32, 0.7)', '#fff')"></div>
            <div class="color-btn" style="background: #556b2f;" onclick="setHighlight('#556b2f', '#fff')"></div>
            <div class="color-btn" style="background: #1a2a3a;" onclick="setHighlight('#1a2a3a', '#fff')"></div>
            <div class="color-btn" style="background: #a0522d;" onclick="setHighlight('#a0522d', '#fff')"></div>
            <div class="color-btn" style="background: transparent; border-color: var(--cream);" onclick="setHighlight('transparent', 'inherit')"><i class="fa-solid fa-eraser" style="font-size: 12px; color: var(--cream); display: flex; justify-content: center; align-items: center; height: 100%;"></i></div>
        </div>

        <div class="notepad" id="notepad" contenteditable="true"></div>
    </div>
</div>

<script>
    // --- مدیریت داده‌ها ---
    let notes = JSON.parse(localStorage.getItem('friendNotesList')) || [];
    let currentNoteId = null;

    // --- توابع اصلی ---
    function saveData() {
        localStorage.setItem('friendNotesList', JSON.stringify(notes));
    }

    function createNote() {
        const titleInput = document.getElementById('newNoteTitle');
        const title = titleInput.value.trim();
        if (!title) return alert("Please enter a title for the note!");

        const newNote = {
            id: Date.now().toString(),
            title: title,
            content: "Start typing here..."
        };
        
        notes.unshift(newNote); // اضافه کردن به اول لیست
        titleInput.value = '';
        saveData();
        renderNotes();
        openNote(newNote.id);
    }

    function renderNotes() {
        const list = document.getElementById('notesList');
        const searchTerm = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = '';

        const filteredNotes = notes.filter(n => n.title.toLowerCase().includes(searchTerm));

        filteredNotes.forEach(note => {
            const card = document.createElement('div');
            card.className = `note-card ${note.id === currentNoteId ? 'active' : ''}`;
            card.onclick = () => openNote(note.id);
            
            // خلاصه متن (حذف تگ‌های HTML و بریدن به ۵۰ کاراکتر)
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = note.content;
            const plainText = tempDiv.textContent || tempDiv.innerText || "";
            const preview = plainText.substring(0, 50) + (plainText.length > 50 ? "..." : "");

            card.innerHTML = `
                <div class="note-title">${note.title}</div>
                <div class="note-preview">${preview || 'Empty note...'}</div>
            `;
            list.appendChild(card);
        });
    }

    function openNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;

        currentNoteId = id;
        document.getElementById('editorContainer').style.display = 'flex';
        document.getElementById('currentNoteTitle').innerText = note.title;
        document.getElementById('notepad').innerHTML = note.content;
        renderNotes(); // برای آپدیت کردن کلاس active
    }

    function deleteCurrentNote() {
        if (!currentNoteId) return;
        if (confirm("Are you sure you want to delete this note?")) {
            notes = notes.filter(n => n.id !== currentNoteId);
            currentNoteId = null;
            saveData();
            document.getElementById('editorContainer').style.display = 'none';
            renderNotes();
        }
    }

    // --- ذخیره خودکار متن ---
    document.getElementById('notepad').addEventListener('input', function() {
        if (!currentNoteId) return;
        const note = notes.find(n => n.id === currentNoteId);
        if (note) {
            note.content = this.innerHTML;
            saveData();
            renderNotes(); // آپدیت پیش‌نمایش
        }
    });

    // --- ابزار هایلایت ---
    let selectedColor = '#e6d5a8';
    let textColor = '#000';

    function setHighlight(bgColor, fgColor) {
        selectedColor = bgColor;
        textColor = fgColor;
    }

    document.getElementById('notepad').addEventListener('mouseup', () => {
        const selection = window.getSelection();
        const notepad = document.getElementById('notepad');
        
        if (!selection.isCollapsed && notepad.contains(selection.anchorNode)) {
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.backgroundColor = selectedColor;
            if (textColor !== 'inherit') span.style.color = textColor;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            
            selection.removeAllRanges();
            // تریگر کردن ذخیره خودکار
            document.getElementById('notepad').dispatchEvent(new Event('input'));
        }
    });

    // --- لود اولیه ---
    renderNotes();

    // اصلاح مشکل RTL برای متن‌های انگلیسی داخل ادیتور
    document.getElementById('notepad').style.textAlign = 'left';
    document.getElementById('notepad').dir = 'ltr';
</script>

</body>
  </html>
