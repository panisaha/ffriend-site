<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - My Study Planner</title>
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app-loader.js"></script>
    <style>
        :root {
            --bg-main: #050505; --bg-card: #111111; --burgundy-dark: #2a050a;
            --burgundy-light: #5c0e1b; --cream: #e8e0d0; --beige: #a89b8c; --hanai: #7a3e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--cream); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

        .navbar { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .nav-btn {
            background-color: var(--bg-card); color: var(--beige); text-decoration: none;
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--burgundy-dark);
            display: flex; align-items: center; gap: 8px; font-weight: bold; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-btn:hover { background-color: var(--burgundy-dark); color: var(--cream); transform: translateY(-2px); }
        .nav-btn.active { background-color: var(--burgundy-light); color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(92, 14, 27, 0.6); }

        .controls { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-box, .new-note-input {
            flex: 1; min-width: 200px; padding: 14px 18px; 
            background-color: #0a0a0a; border: 1px solid #222; border-radius: 30px;
            color: var(--cream); outline: none; font-size: 1rem; transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .search-box:focus, .new-note-input:focus { border-color: var(--burgundy-light); background-color: #111; box-shadow: 0 0 15px rgba(92, 14, 27, 0.3); }
        ::placeholder { color: #555; font-style: italic; }
        
        .btn-primary { background-color: var(--burgundy-light); color: var(--cream); border: 1px solid var(--burgundy-dark); padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary:hover { background-color: var(--burgundy-dark); transform: scale(1.05); }

        .notes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .note-card { background-color: var(--bg-card); border: 1px solid var(--burgundy-dark); padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .note-card:hover { border-color: var(--hanai); transform: translateY(-3px); }
        .note-card.active { border-color: var(--cream); background-color: var(--burgundy-dark); }
        .note-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: var(--cream); }
        .note-preview { font-size: 0.85rem; color: var(--beige); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .editor-container { background-color: var(--bg-card); border: 1px solid var(--burgundy-dark); border-radius: 15px; padding: 20px; display: none; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .editor-header { display: flex; justify-content: space-between; align-items: center; }
        .editor-title { font-size: 1.2rem; color: var(--burgundy-light); font-weight: bold; }
        .delete-note-btn { color: var(--burgundy-light); background: none; border: none; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .delete-note-btn:hover { color: red; transform: scale(1.2); }

        .highlighter-tools { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 15px; border-bottom: 1px solid var(--burgundy-dark); flex-wrap: wrap;}
        .highlighter-btn { background: #333; color: var(--cream); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .highlighter-btn.active { background: var(--burgundy-light); box-shadow: 0 0 10px rgba(92,14,27,0.8); }
        
        .colors-container { display: none; gap: 10px; }
        .colors-container.show { display: flex; }
        
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--beige); cursor: pointer; transition: 0.2s; }
        .color-btn:hover { transform: scale(1.15); border-color: var(--cream); }
        .color-btn.selected { border-color: var(--cream); transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .notepad {
            width: 100%; min-height: 300px; padding: 15px; background-color: #1a1a1a;
            border: 1px solid var(--burgundy-dark); border-radius: 10px; color: var(--cream);
            font-size: 1.2rem; line-height: 2; outline: none; overflow-y: auto;
            -webkit-user-select: text; user-select: text;
            /* این دو خط مشکل جهت متن رو حل می‌کنن */
            unicode-bidi: plaintext; 
            text-align: start;
        }
        .notepad:focus { border-color: var(--burgundy-light); box-shadow: 0 0 10px rgba(92,14,27,0.3); }

        .notepad.eraser-mode { cursor: cell; -webkit-user-select: none; user-select: none; }
        
        .word-highlight { border-radius: 4px; padding: 2px 4px; margin: 0 2px; cursor: pointer; transition: 0.2s; }
        .word-highlight:hover { opacity: 0.8; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background-color: var(--bg-card); border: 1px solid var(--burgundy-light); padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); animation: fadeIn 0.3s ease; text-align: center; }
        .modal-box h3 { color: var(--cream); margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        .btn-yes { background-color: var(--burgundy-light); color: var(--cream); }
        .btn-yes:hover { background-color: var(--burgundy-dark); }
        .btn-no { background-color: #333; color: var(--cream); }
        .btn-no:hover { background-color: #555; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="notes.html" class="nav-btn active"><i class="fa-solid fa-book-open"></i> Notes</a>
        <a href="tasks.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="timer.html" class="nav-btn"><i class="fa-solid fa-clock"></i> Timer</a>
        <a href="links.html" class="nav-btn"><i class="fa-solid fa-link"></i> Links</a>
        <a href="alarm.html" class="nav-btn"><i class="fa-solid fa-bell"></i> Alarm</a>
        <a href="support.html" class="nav-btn"><i class="fa-solid fa-headset"></i> Support</a>
    </nav>

    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes..." oninput="renderNotes()">
        <input type="text" class="new-note-input" id="newNoteTitle" placeholder="New note title...">
        <button class="btn-primary" onclick="createNote()"><i class="fa-solid fa-plus"></i> New Note</button>
    </div>

    <div class="notes-list" id="notesList"></div>

    <div class="editor-container" id="editorContainer">
        <div class="editor-header">
            <div class="editor-title" id="currentNoteTitle"></div>
            <button class="delete-note-btn" onclick="askDeleteNote()"><i class="fa-solid fa-trash"></i></button>
        </div>
        
        <div class="highlighter-tools">
            <button class="highlighter-btn" id="highlighterBtn" onclick="toggleColors()">
                <i class="fa-solid fa-highlighter"></i> Highlighter
            </button>
            <div class="colors-container" id="colorsContainer">
                <div class="color-btn" style="background: #e6d5a8;" onclick="selectColor('#e6d5a8', '#000', this)"></div>
                <div class="color-btn" style="background: rgba(128, 0, 32, 0.7);" onclick="selectColor('rgba(128, 0, 32, 0.7)', '#fff', this)"></div>
                <div class="color-btn" style="background: #556b2f;" onclick="selectColor('#556b2f', '#fff', this)"></div>
                <div class="color-btn" style="background: #1a2a3a;" onclick="selectColor('#1a2a3a', '#fff', this)"></div>
                <div class="color-btn" style="background: #a0522d;" onclick="selectColor('#a0522d', '#fff', this)"></div>
            </div>
            <button class="highlighter-btn" id="eraserBtn" onclick="toggleEraser()">
                <i class="fa-solid fa-eraser"></i> Eraser
            </button>
        </div>

        <div class="notepad" id="notepad" contenteditable="true"></div>
    </div>
</div>

<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <h3>Delete Note?</h3>
        <div class="modal-btns">
            <button class="btn-modal btn-yes" onclick="confirmDeleteNote()">Yes</button>
            <button class="btn-modal btn-no" onclick="closeModal('deleteModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="errorModal">
    <div class="modal-box">
        <h3 style="color: var(--burgundy-light);">Oops!</h3>
        <p id="errorText" style="color: var(--beige); margin-bottom: 20px;"></p>
        <button class="btn-modal btn-no" style="width: 100%;" onclick="closeModal('errorModal')">OK</button>
    </div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('friendNotesList')) || [];
    let currentNoteId = null;
    let isHighlighterActive = false;
    let isEraserActive = false;
    let activeColor = '#e6d5a8';
    let activeTextColor = '#000';

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function showError(msg) { document.getElementById('errorText').innerText = msg; openModal('errorModal'); }

    function createNote() {
        const titleInput = document.getElementById('newNoteTitle');
        const title = titleInput.value.trim();
        if (!title) { showError("Please enter a title for the note!"); return; }
        const newNote = { id: Date.now().toString(), title: title, content: "" };
        notes.unshift(newNote);
        titleInput.value = '';
        saveData(); renderNotes(); openNote(newNote.id);
    }

    function saveData() { localStorage.setItem('friendNotesList', JSON.stringify(notes)); }

    function renderNotes() {
        const list = document.getElementById('notesList');
        const searchTerm = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = '';
        notes.filter(n => n.title.toLowerCase().includes(searchTerm)).forEach(note => {
            const card = document.createElement('div');
            card.className = `note-card ${note.id === currentNoteId ? 'active' : ''}`;
            card.onclick = () => openNote(note.id);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = note.content;
            const plainText = tempDiv.textContent || tempDiv.innerText || "";
            card.innerHTML = `<div class="note-title">${note.title}</div><div class="note-preview">${plainText.substring(0, 50) || 'Empty note...'}</div>`;
            list.appendChild(card);
        });
    }

    function openNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;
        currentNoteId = id;
        document.getElementById('editorContainer').style.display = 'flex';
        document.getElementById('currentNoteTitle').innerText = note.title;
        document.getElementById('notepad').innerHTML = note.content;
        renderNotes();
    }

    function askDeleteNote() { if (currentNoteId) openModal('deleteModal'); }
    function confirmDeleteNote() {
        notes = notes.filter(n => n.id !== currentNoteId);
        currentNoteId = null;
        saveData();
        document.getElementById('editorContainer').style.display = 'none';
        renderNotes(); closeModal('deleteModal');
    }

    document.getElementById('notepad').addEventListener('input', function() {
        if (!currentNoteId) return;
        const note = notes.find(n => n.id === currentNoteId);
        if (note) { note.content = this.innerHTML; saveData(); renderNotes(); }
    });

    // --- سیستم ماژیک ---
    function toggleColors() {
        const colors = document.getElementById('colorsContainer');
        const btn = document.getElementById('highlighterBtn');
        colors.classList.toggle('show');
        btn.classList.toggle('active');
        if (!colors.classList.contains('show')) { isHighlighterActive = false; }
        
        if (colors.classList.contains('show') && isEraserActive) {
            toggleEraser();
        }
    }

    function selectColor(bg, fg, element) {
        activeColor = bg; activeTextColor = fg; isHighlighterActive = true;
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
        element.classList.add('selected');

        if (isEraserActive) {
            toggleEraser();
        }
    }

    // --- سیستم پاک‌کن ---
    function toggleEraser() {
        isEraserActive = !isEraserActive;
        const eraserBtn = document.getElementById('eraserBtn');
        const notepad = document.getElementById('notepad');

        if (isEraserActive) {
            isHighlighterActive = false;
            document.getElementById('highlighterBtn').classList.remove('active');
            document.getElementById('colorsContainer').classList.remove('show');

            eraserBtn.classList.add('active');
            notepad.classList.add('eraser-mode');
        } else {
            eraserBtn.classList.remove('active');
            notepad.classList.remove('eraser-mode');
        }
    }

    // --- منطق هایلایت با انتخاب متن ---
    const notepadEl = document.getElementById('notepad');

    function applyHighlight() {
        if (!isHighlighterActive || isEraserActive) return;

        const selection = window.getSelection();
        if (selection.rangeCount === 0) return;

        const range = selection.getRangeAt(0);
        const selectedText = selection.toString().trim();
        if (selectedText.length === 0) return;

        if (!notepadEl.contains(range.commonAncestorContainer)) return;

        const span = document.createElement('span');
        span.className = 'word-highlight';
        span.style.backgroundColor = activeColor;
        span.style.color = activeTextColor;

        span.appendChild(range.extractContents());
        range.insertNode(span);
        selection.removeAllRanges();
        notepadEl.dispatchEvent(new Event('input'));
    }

    notepadEl.addEventListener('mouseup', function(e) {
        setTimeout(applyHighlight, 10);
    });

    notepadEl.addEventListener('touchend', function(e) {
        if (isEraserActive) return;
        setTimeout(applyHighlight, 50);
    });

    // --- منطق پاک‌کن (کشیدن) ---
    let isDrawing = false;

    function eraseAtPoint(x, y) {
        const element = document.elementFromPoint(x, y);
        if (element && element.classList.contains('word-highlight')) {
            const text = element.innerText;
            const textNode = document.createTextNode(text);
            element.parentNode.replaceChild(textNode, element);
            notepadEl.dispatchEvent(new Event('input'));
        }
    }

    notepadEl.addEventListener('mousedown', function(e) {
        if (isEraserActive) {
            isDrawing = true;
            eraseAtPoint(e.clientX, e.clientY);
            e.preventDefault();
        }
    });

    notepadEl.addEventListener('mousemove', function(e) {
        if (isDrawing && isEraserActive) {
            eraseAtPoint(e.clientX, e.clientY);
            e.preventDefault();
        }
    });

    document.addEventListener('mouseup', function() {
        isDrawing = false;
    });

    notepadEl.addEventListener('touchstart', function(e) {
        if (isEraserActive) {
            isDrawing = true;
            const touch = e.touches[0];
            eraseAtPoint(touch.clientX, touch.clientY);
            e.preventDefault();
        }
    }, { passive: false });

    notepadEl.addEventListener('touchmove', function(e) {
        if (isDrawing && isEraserActive) {
            const touch = e.touches[0];
            eraseAtPoint(touch.clientX, touch.clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', function() {
        isDrawing = false;
    });

    renderNotes();
</script>

</body>
</html>
